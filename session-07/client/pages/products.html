<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/style.css" />
    <script src="../scripts/products.js" defer></script>
    <script src="../scripts/set-nav-active.js" defer></script>
    <title>Products</title>
  </head>
  <body>
    <h1>Products</h1>
    <header id="navbar"></header>

    <section class="edit-section">
      <h2>Edit product</h2>
      <div>
        <label for="edit-product-id">Product id:</label>
        <input type="text" id="edit-product-id" disabled />
      </div>
      <div>
        <label for="edit-product-name">Product Name:</label>
        <input type="text" id="edit-product-name" />
      </div>
      <div>
        <label for="edit-product-price">Product price:</label>
        <input type="number" id="edit-product-price" />
      </div>
      <button id="edit-product">Edit Product</button>
    </section>

    <section>
      <h2>Product List</h2>
      <button id="get-products">Refresh</button>
      <ul id="product-list"></ul>
    </section>
  </body>
</html>
