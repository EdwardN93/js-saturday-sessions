<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script src="../main.js" defer></script>

    <title>Document</title>
  </head>
  <body>
    <div
      class="d-flex justify-content-center flex-column align-items-center align-middle p-2"
    >
      <h2 class="timer">
        <span class="hrs">00</span>:<span class="minutes">00</span>:<span
          class="seconds"
          >00</span
        >
      </h2>
    </div>
    <div class="progress" style="width: 25%">
      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Example 20px high"
        aria-valuenow="25"
        aria-valuemin="0"
        aria-valuemax="100"
        style="height: 20px; width: 100%"
      ></div>
    </div>
    <button class="stopTimer">Stop Timer</button>
    <button class="pauseTimer">Pause Timer</button>
  </body>
</html>
